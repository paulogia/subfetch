[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subfetch"
version = "0.3.0"
description = "YouTube subtitle extractor for channel archiving"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.11.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
subfetch = "subfetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
